# Ask Me -- nginx reverse proxy.
#
# Two server blocks on purpose:
#
#   :80   public / tunnel-facing. The admin panel is HARD-BLOCKED here.
#   :8081 loopback only. Full app including /admin.
#
# Why not one block with an IP allowlist on /admin? Because behind a tunnel
# (ngrok, cloudflared) every request arrives from 127.0.0.1, so "allow
# 127.0.0.1" on /admin would expose the panel to the entire internet. Splitting
# by port means the public listener has no route to /admin at all.

upstream askme {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Chat traffic gets a rate limit at the edge as well as in the app, so a flood
# never reaches Groq and never costs tokens.
limit_req_zone $binary_remote_addr zone=askme_chat:10m rate=30r/m;

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection        "";

# ------------------------------------------------------------ public listener

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 10m;

    # LLM calls are slow; don't cut them off mid-answer.
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The admin panel does not exist on the public listener.
    location /admin        { return 404; }
    location /api/admin/   { return 404; }

    location /api/chat {
        limit_req zone=askme_chat burst=10 nodelay;
        limit_req_status 429;

        # Preserve the real client IP through a tunnel: ngrok/cloudflared put
        # it at the head of X-Forwarded-For, and the app reads the head.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://askme;
    }

    location / {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://askme;
    }
}

# ------------------------------------------------------------- admin listener

server {
    listen 127.0.0.1:8081;
    server_name localhost;

    client_max_body_size 10m;
    proxy_read_timeout 300s;   # embedding a large upload takes a moment

    location / {
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://askme;
    }
}
